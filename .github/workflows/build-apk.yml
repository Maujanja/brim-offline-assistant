name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Modeli ndogo ya Vosk (Kiingereza, ~40 MB) inawekwa ndani ya APK ili wake word ifanye kazi bila intaneti
      - name: Download Vosk model
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/assets
          curl -L --fail -o /tmp/vosk.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q /tmp/vosk.zip -d /tmp/vosk
          rm -rf app/src/main/assets/model-en
          mv /tmp/vosk/vosk-model-small-en-us-0.15 app/src/main/assets/model-en
          # StorageService.unpack inahitaji faili la uuid kujua kama inakili upya
          cat /proc/sys/kernel/random/uuid > app/src/main/assets/model-en/uuid
          du -sh app/src/main/assets/model-en

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Msaidizi.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Msaidizi-apk
          path: Msaidizi.apk

      # Inaweka APK kwenye Releases ili uipakue moja kwa moja kwenye simu
      - name: Publish to Releases (latest)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest Msaidizi.apk \
            --title "Msaidizi (latest build)" \
            --notes "Debug APK iliyojengwa kutoka commit ${GITHUB_SHA::7}" \
            --target "$GITHUB_SHA"
